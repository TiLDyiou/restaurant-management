user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Load balancing upstream orchestrating 2 API instances
    upstream qlnh_api {
        server api1:8080;
        server api2:8080;
        keepalive 32;
    }

    # HTTP server block: Redirects all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name qlnhnhom2.me www.qlnhnhom2.me;

        # ACME challenge location for Certbot SSL renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server block
    server {
        listen 443 ssl;
        server_name qlnhnhom2.me www.qlnhnhom2.me;

        # SSL certificates (volume mounted in production)
        ssl_certificate /etc/letsencrypt/live/qlnhnhom2.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/qlnhnhom2.me/privkey.pem;

        # Premium SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Default proxy settings for standard HTTP APIs
        location / {
            proxy_pass http://qlnh_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # WebSocket upgrading reverse proxy for SignalR restaurantHub
        location /restaurantHub {
            proxy_pass http://qlnh_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket long-lived connection timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # WebSocket upgrading reverse proxy for SignalR restaurantChatHub
        location /restaurantChatHub {
            proxy_pass http://qlnh_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket long-lived connection timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
