name: Deploy to DigitalOcean VPS

on:
  push:
    branches:
      - main
      - refactor/backend-refactor-all

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Backend/RestaurantManagementAPI/**"
          target: "/var/www/restaurant-management"
          strip_components: 0

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/restaurant-management/Backend/RestaurantManagementAPI
            
            # Khởi tạo file .env từ .env.example nếu chưa tồn tại trên VPS
            if [ ! -f .env ]; then
              echo "Creating default .env file..."
              cp .env.example .env
              
              # Cập nhật các mật khẩu mặc định sang chuỗi bảo mật ngẫu nhiên
              DB_PASS=$(openssl rand -hex 12)
              JWT_SECRET=$(openssl rand -base64 32)
              
              sed -i "s/YourSecurePassword123!/$DB_PASS/g" .env
              sed -i "s/YourSuperSecretAndSecureKeyThatIsAtLeast32BytesLong!/$JWT_SECRET/g" .env
              
              echo "Môi trường .env mới đã được khởi tạo. Hãy SSH vào VPS để chỉnh sửa các thông số Email/Gmail App Password nếu cần thiết."
            fi

            # Khởi chạy Docker Compose
            echo "Starting Docker containers..."
            docker compose down
            docker compose up -d --build
            
            echo "Deployment completed successfully!"
