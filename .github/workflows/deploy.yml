name: Deploy to DigitalOcean VPS

on:
  push:
    branches:
      - main
      - refactor/backend-refactor-all

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t restaurant-api:latest ./Backend
          docker save restaurant-api:latest | gzip > Backend/restaurant-api.tar.gz

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Backend/**"
          target: "/var/www/restaurant-management"
          strip_components: 0

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/restaurant-management/Backend
            
            # Khởi tạo file .env từ .env.example nếu chưa tồn tại trên VPS
            if [ ! -f .env ]; then
              echo "Creating default .env file..."
              cp .env.example .env
              
              # Cập nhật các mật khẩu mặc định sang chuỗi bảo mật ngẫu nhiên (đảm bảo độ phức tạp của SQL Server)
              DB_PASS="SqlPass_${RANDOM}_$(openssl rand -base64 12 | tr -d '/+=')"
              JWT_SECRET=$(openssl rand -base64 32)
              
              sed -i "s/YourSecurePassword123!/$DB_PASS/g" .env
              sed -i "s/YourSuperSecretAndSecureKeyThatIsAtLeast32BytesLong!/$JWT_SECRET/g" .env
              
              echo "Môi trường .env mới đã được khởi tạo. Hãy SSH vào VPS để chỉnh sửa các thông số Email/Gmail App Password nếu cần thiết."
            fi

            # Dừng các container cũ ở thư mục cũ (nếu có) để tránh xung đột port
            if [ -d /var/www/restaurant-management/Backend/RestaurantManagementAPI ]; then
              echo "Stopping old containers..."
              cd /var/www/restaurant-management/Backend/RestaurantManagementAPI && docker compose down || true
              cd /var/www/restaurant-management/Backend
            fi

            # Load the pre-built Docker image from the tar file
            if [ -f restaurant-api.tar.gz ]; then
              echo "Loading pre-built Docker image..."
              docker load < restaurant-api.tar.gz
              # Xóa file tar.gz để giải phóng dung lượng VPS
              rm -f restaurant-api.tar.gz
            fi

            # Khởi chạy Docker Compose
            echo "Starting Docker containers..."
            docker compose down
            docker compose up -d
            
            # Dọn dẹp các image rác cũ để tránh đầy ổ cứng VPS
            docker image prune -f
            
            echo "Deployment completed successfully!"
